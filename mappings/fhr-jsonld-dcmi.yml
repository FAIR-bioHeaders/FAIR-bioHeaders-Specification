- path: checksum
  jsonld:
    term: https://w3id.org/fair-bioheaders/terms#checksum
    status: fhr
    kind: exact
    coercion: literal
  schemaorg_gap: 'sdo:sha256 is SHA-256 of a MediaObject: a different algorithm and subject. The FHR checksum
    is SHA-512/256 over the exact file bytes (docs/FORMAT.md).'
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI has no checksum term.
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/FORMAT.md
  - https://schema.org/sha256
- path: assemblySoftware
  jsonld:
    term: https://w3id.org/fair-bioheaders/terms#assemblySoftware
    status: fhr
    kind: exact
    coercion: set-of-nodes
    type:
    - http://schema.org/SoftwareApplication
    rdf_loss: order of @set items
  schemaorg_gap: schema.org has no "software used to create" property for a CreativeWork.
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI Metadata Terms have no property for software provenance.
  notes: A legacy string value stays a literal, not a node.
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://bioschemas.org/profiles/ComputationalTool/1.0-RELEASE
- path: assemblySoftware[].name
  jsonld:
    term: http://schema.org/name
    status: core
    kind: exact
    coercion: literal
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI Metadata Terms have no property for software provenance.
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://schema.org/name
  - https://bioschemas.org/profiles/ComputationalTool/1.0-RELEASE
- path: assemblySoftware[].uri
  jsonld:
    term: http://schema.org/url
    status: core
    kind: conditional
    condition: the URI is the software's home or repository page
    coercion: iri
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI Metadata Terms have no property for software provenance.
  notes: 'Not the node @id: an @id would merge every record''s node for the same tool, mixing versions
    and options.'
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://schema.org/url
  - https://bioschemas.org/profiles/ComputationalTool/1.0-RELEASE
- path: assemblySoftware[].version
  jsonld:
    term: http://schema.org/softwareVersion
    status: core
    kind: exact
    coercion: literal
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI Metadata Terms have no property for software provenance.
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://schema.org/softwareVersion
  - https://bioschemas.org/profiles/ComputationalTool/1.0-RELEASE
- path: assemblySoftware[].commandLineOption[]
  jsonld:
    term: https://w3id.org/fair-bioheaders/terms#commandLineOption
    status: fhr
    kind: exact
    coercion: list
  schemaorg_gap: schema.org has no property for command-line options.
  dcmi:
  - term: none
    kind: unsupported
    reason: DCMI Metadata Terms have no property for software provenance.
  notes: Order matters (-t 2), so this is an RDF list.
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
- path: assemblyProtocol
  jsonld:
    term: https://w3id.org/fair-bioheaders/terms#assemblyProtocol
    status: fhr
    kind: exact
    coercion: iri
  schemaorg_gap: sdo:measurementTechnique is related but means a measurement technique.
  dcmi:
  - term: http://purl.org/dc/terms/relation
    status: dcmi
    kind: broader
  notes: 'MIxS sop is broader (existing broad_mappings in fhr_linkml.yml; fhr_mappings.yml words the same
    pair as relationship: narrow, in the opposite direction).'
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://schema.org/measurementTechnique
- path: seqcol_id
  jsonld:
    term: https://w3id.org/fair-bioheaders/terms#seqcol_id
    status: fhr
    kind: exact
    coercion: literal
  schemaorg_gap: schema.org has no term for a sequence collection digest; it is not an FHR checksum and
    not a citation identifier.
  dcmi:
  - term: none
    kind: unsupported
    reason: A supplied GA4GH identifier, not a citation identifier (#56).
  sources:
  - https://github.com/FAIR-bioHeaders/FHR-Specification/issues/56
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/MAPPINGS.md
  - https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/FORMAT.md
