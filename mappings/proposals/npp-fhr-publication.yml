# NPP/Janeway publication slice for FHR 2.1 — DRAFT, not adopted, not official.
# MPL-2.0; see LICENSE.
# Purpose: #249 (Project 13 / #292 round NPP-2) machine-readable crosswalk of every
# FHR 2.1 property path onto the three publication targets of the New Prairie Press
# Janeway slice: JATS (article plus verified-metadata table), HTML (published FHR
# microdata binding and the curated schema.org export), and DOI registration
# metadata (Crossref 5.5 dataset/article records — the only agency path Janeway core
# v1.8.4 reaches; DataCite stays deferred per profile-status.yml).
# Authority: semantics and identity discipline from #56 (mappings/fhr-jsonld-dcmi.yml,
# mappings/fhr-schemaorg-export.yml, docs/MICRODATA.md); workflow and the meaning of
# verified from #248. This file proposes no schema change and claims no exporter,
# registration or official label.
# Publisher-dependent columns record settled pins from #292 (comment 7174452756 and the
# maintainer approval of the 2026-11-26 decision proposals, comment 7194271285):
# Q1 Genome Notes prospective venue, Q2 Janeway 1.8.4, Q3 JATS 1.4 / NISO Z39.96-2024,
# Q1b no article prose in v1 (DOI descriptions composition only), Q6b dataset DOIs belong
# to the data repository and no exotic Crossref slot is relied on.
# Only toolchain-verification markers tbd(Q3b) remain open (NPP-3 measurement).
profile_version: 0.1.0-draft.2
status: adoption-pending
official: false
adoption_decision: null  # maintainer records the dated acceptance decision; this PR only prepares the final state
source_schema: https://w3id.org/fair-bioheaders/fhr/v0.8.0
source_schema_version: '2.1'
resource_scope: assembly
coverage: Exactly one entry per FHR property path, in the same property order as mappings/fhr-jsonld-dcmi.yml;
  no path omitted, no path added.
existing_mapping_tables:
  dcmi_and_jsonld: mappings/fhr-jsonld-dcmi.yml
  schemaorg_export: mappings/fhr-schemaorg-export.yml
  html_binding: docs/MICRODATA.md
targets:
  jats:
    name: JATS Archiving and Publishing
    version: '1.4 (NISO Z39.96-2024, pinned per #292 Q3; NPP deployment production-toolchain slot verification retained as tbd Q3b)'
    reference: https://jats.nlm.nih.gov/archiving/tag-library/1.4/
    invariants:
    - 'Every FHR value renders at minimum as a labeled row of the stable-ID verified-metadata table described
      by #248; structured targets below are additive.'
    - The table binds its input revision and digests through its associated file and report links; the
      table alone never claims more than the report records.
    - Generated table content is deterministic from pinned inputs; no live services.
  html:
    microdata:
      name: FHR HTML microdata binding
      reference: docs/MICRODATA.md
      rule: itemprop equals the FHR property path; typed containers and escaping per M1-M5; values are
        never emitted as href or src.
    schemaorg:
      name: schema.org export
      version: v30.1
      reference: mappings/fhr-schemaorg-export.yml
      rule: Property citations below point into the curated export table; this slice re-declares nothing.
  doi:
    agency: crossref
    record_types:
      dataset: Crossref 5.5.0 dataset record PREPARED FOR THE DATA REPOSITORY (registration owned by the repository, not the journal plugin - decision 2026-11-26; XSD pin per profile-status.yml)
      article: 'Crossref 5.5.0 journal-article record (confirmed Janeway 1.8.4 register_crossref_doi route per #292 Q6) - receives article context only; FH field values
        enter the article deposit only where listed'
      preprint: 'Crossref 5.5.0 posted_content / preprint record (confirmed Janeway 1.8.4 register_preprint_doi route per #292 Q6) - receives preprint manuscript context only;
        never conflated with dataset record title or assembly creators'
    reference: https://www.crossref.org/documentation/schema-library/metadata-deposit-schema-5-5-0/
    invariants:
    - Dataset-record projections are prepared artifacts for the data repository; the journal
      plugin never submits dataset registrations (maintainer decision 2026-11-26). The plugin
      references a dataset DOI supplied in context from article/preprint records only.
    - Article, dataset and metadata-record identities never merge; assembly creators are not article authors;
      no value moves between records without its subject declared.
    - The plugin prepares; only the publisher registers. No identifier is minted or invented anywhere
      in this table.
    - Unsupported technical detail stays in the authoritative FH file and linked report with the loss
      recorded in loss; it is never stuffed into unrelated fields.
kind_vocabulary:
  structured: Has a named element or property target on this axis.
  row-only: Renders only as a labeled verified-metadata table row on this axis.
  conditional: Structured target applies only when the stated condition holds; otherwise row-only.
  unsupported: No faithful target on this axis; explicit loss recorded.
entries:
- path: schema
  source_cardinality: '1'
  subject: metadata-record
  jats:
    kind: unsupported
    note: Record self-description; the article cites the file, not the reverse
  html:
    microdata: schema
    schemaorg: sdo:schemaVersion
  doi:
    record: none
    kind: unsupported
    loss: Registration agencies have no FH-contract citation element; the cited alias rides with the linked
      authoritative record
- path: schemaVersion
  source_cardinality: '1'
  subject: metadata-record
  jats:
    kind: structured
    target: Table row "Contract version" plus an attribute of the related-object linking the file
  html:
    microdata: schemaVersion
    schemaorg: fhr:schemaVersion
  doi:
    record: none
    kind: unsupported
    loss: Keep contract version with the record, distinct from publication version (profile-status note)
- path: genome
  source_cardinality: '1'
  subject: resource
  jats:
    kind: structured
    target: related-object document-id component; data-availability prose; table row
  html:
    microdata: genome
    schemaorg: sdo:name
  doi:
    record: dataset
    kind: structured
    property: titles.title
    condition: Dataset record name composes genome plus version per agency norms; the article title comes
      from the manuscript, never from FHR
- path: genomeSynonym[]
  source_cardinality: 0..n
  subject: resource
  jats:
    kind: structured
    target: alt-title of the data-availability section; table rows
  html:
    microdata: genomeSynonym
    schemaorg: sdo:alternateName
  doi:
    record: dataset
    kind: conditional
    property: alt-title or originalLanguage equivalent
    condition: no alt-title reliance - descriptions text only (decision 2026-11-26)
- path: taxon
  source_cardinality: '1'
  subject: resource
  jats:
    kind: structured
    target: kwd-group kwd-group-type=taxon wrapping name and uri
  html:
    microdata: taxon
    schemaorg: sdo:about
  doi:
    record: dataset
    kind: structured
    property: subjects.subject with subjectScheme=NCBI Taxonomy
- path: taxon.name
  source_cardinality: '1'
  subject: resource
  jats:
    kind: structured
    target: kwd text
  html:
    microdata: taxon.name
    schemaorg: sdo:name
  doi:
