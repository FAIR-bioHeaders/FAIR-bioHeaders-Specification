# Adopted mapping-v1 foundation; not official or a shipped exporter. MPL-2.0.
profile_version: 0.1.0-draft.1
status: adopted
official: false
adoption_decision: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification/issues/211#issuecomment-6880245660
checked_on: '2026-11-16'
scope: Adopted v1 is the root-field assembly foundation only; deep per-target adapters below are deferred to separate follow-ups.
targets:
  dcmi-qualified:
    status: adopted-foundation
    candidate_version: '2020-01-20'
    reference: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/2020-01-20/
    remaining: Deterministic Tools exporter, installed-artifact evidence and shipment; official label withheld until exporter shipment.
  datacite:
    status: deferred
    candidate_version: '4.7'
    reference: https://schema.datacite.org/meta/kernel-4.7/
    remaining: Pin XSD and REST envelope contracts; full fixtures; mandatory deposit context and offline
      validation.
  crossref:
    status: deferred
    candidate_version: 5.5.0
    reference: https://www.crossref.org/documentation/schema-library/metadata-deposit-schema-5-5-0/
    remaining: Review database/dataset record structure; pin XSD; full deposit XML and registration
      context; offline validation.
  ark:
    status: deferred
    candidate_version: draft-kunze-ark, 2026-05-08 (work in progress)
    reference: https://arks-org.github.io/arkspec/draft-kunze-ark.html
    remaining: Select binding/resolver policy; existing-assigned identifier fixtures; optional ERC;
      no minting.
  bibtex:
    status: deferred
    candidate_version: classic @misc; tool/style versions not yet selected
    reference: https://www.bibtex.org/Using/
    remaining: Citation-only adapter first; rendering/tool matrix; separately assess metadata-bearing
      note payload.
  biblatex:
    status: deferred
    candidate_version: '@dataset; tool/style versions not yet selected'
    reference: https://ctan.org/pkg/biblatex
    remaining: Separate dataset profile; select backend/style/version and test Unicode, corporate
      authors, and rendering.
  npp-jats-html-doi:
    status: adoption-pending
    candidate_version: 0.1.0-draft.3
    adoption_decision: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification/issues/249#issuecomment-7219909539
    revision_note: 'draft.3 corrects the taxon.uri JATS target (specific-use is not
      legal on kwd in JATS 1.4, found by offline XSD validation) and accompanies the
      harness L-statistic unit fix (FORMAT.md counts). draft.2 remains the accepted
      record of 2026-11-27; draft.3 requires its own dated maintainer acceptance.'
    reference: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification/blob/main/mappings/proposals/npp-fhr-publication.yml
    remaining: 'ADOPTED mapping slice (maintainer acceptance 2026-11-27, adoption_decision
      above; #249 stays open on its remaining criteria). Open work: tbd(Q3b) production
      JATS toolchain-slot verification at NPP-3 and website #29 coordination. Pins recorded:
      Q1 Genome Notes prospective venue, Q2 Janeway 1.8.4, Q3 JATS 1.4 / NISO Z39.96-2024,
      Q6 Crossref 5.5.0 article + preprint routes; Q1b (no article prose in v1) and Q6b
      (dataset DOIs belong to the data repository; no exotic Crossref slots) settled 2026-11-26.
      DataCite stays with the deferred datacite row until G2 (no DataCite path in Janeway core
      v1.8.4) is resolved. Adoption implies no exporter, registration or official label;
      official remains false and the version stays 0.1.0-draft.2.'
header_types:
  FHR:
    status: adopted-foundation
    released_schema_version: '2.0'
    release: v0.4.0
  FHP:
    status: not-yet-profiled
    released_schema_version: '1.2'
    release: v0.6.0
    remaining: Review protein-set resource scope and source/creator roles; do not assume every set
      is a complete proteome.
  FHGFF3:
    status: not-yet-profiled
    released_schema_version: '1.2'
    release: v0.6.0
    remaining: Review annotation-resource creators, source identity and genome-reference relationships.
  FHT:
    status: deferred
    remaining: FHT 1.0 publication in v0.7.0 does not adopt an FHT mapping or context projection.
      Family-specific mapping review remains outside the adopted v1 foundation; do not copy legacy fields into this profile.
