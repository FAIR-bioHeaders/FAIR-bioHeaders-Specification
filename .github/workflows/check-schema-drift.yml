name: Check schema drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test drift detection
        run: python -m unittest discover -s tests -p test_schema_drift.py -v
      - name: Check published schema against its review baseline
        run: python scripts/check_schema_drift.py
      - name: Check the FHP schema against its review baseline
        run: python scripts/check_schema_drift.py --schema fhp.json --baseline .github/schema-baseline-fhp.json
      - name: Check the FHGFF3 schema against its review baseline
        run: python scripts/check_schema_drift.py --schema fhgff3.json --baseline .github/schema-baseline-fhgff3.json
