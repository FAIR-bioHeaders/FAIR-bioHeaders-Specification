name: Validate specification

on:
  push:
    branches: [main, release-v0.4]
  pull_request:
    branches: [main, release-v0.4]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Schema-selection vectors cite older releases, whose schemas are read
          # from their tags (docs/SCHEMA-VERSIONS.md).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Install JSON-LD test dependencies
        run: python -m pip install -r requirements-jsonld.txt
      - name: Test validation checks
        run: python -m unittest discover -s tests -v
      - name: Validate schema and examples
        run: python scripts/validate_examples.py
      - name: Validate the FHP schema and examples
        run: python scripts/validate_examples.py --schema fhp.json --examples examples/fhp
      - name: Validate the FHGFF3 schema and examples
        run: python scripts/validate_examples.py --schema fhgff3.json --examples examples/fhgff3

      - name: Check LinkML validation equivalence
        run: python scripts/check_linkml.py
      - name: Check the generated JSON-LD context and vocabulary
        run: python scripts/make_jsonld.py --check

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check conformance vectors with the standard library only
        run: python scripts/check_conformance.py
      - name: Install the toolkit with the v0.4 schemas
        # fair-bioheaders 0.7.0 is the first release that bundles v0.4.0.
        run: |
          python -m venv "$RUNNER_TEMP/fhr-converter"
          "$RUNNER_TEMP/fhr-converter/bin/python" -m pip install "fair-bioheaders[jsonld]==0.7.0"
      - name: Run the toolkit on every vector
        run: python scripts/check_conformance.py --skip-regeneration --require-format jsonld --require-format fhp-fasta --require-format fhgff3 --converter "$RUNNER_TEMP/fhr-converter"
