name: Validate specification

on:
  push:
    branches: [main, release-v0.4]
  pull_request:
    branches: [main, release-v0.4]

permissions:
  contents: read

jobs:
  assessment-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixture dependencies and the pinned published assessment tool
        run: |
          version="$(python -c 'import json; print(json.load(open("conformance/toolkit-pin.json"))["version"])')"
          python -m pip install -r requirements-validation.txt "fair-bioheaders==$version"
      - name: Check regeneration oracles and real archive assessment
        run: |
          export ASSESSMENT_TOOLKIT="$(command -v bioheaders)"
          python -m unittest discover -s tests -p test_assessment_fixtures.py -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Schema-selection vectors cite older releases, whose schemas are read
          # from their tags (docs/SCHEMA-VERSIONS.md).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Install JSON-LD test dependencies
        run: python -m pip install -r requirements-jsonld.txt
      - name: Test validation checks
        run: python -m unittest discover -s tests -v
      - name: Validate schema and examples
        run: python scripts/validate_examples.py
      - name: Validate the FHP schema and examples
        run: python scripts/validate_examples.py --schema fhp.json --examples examples/fhp
      - name: Validate the FHGFF3 schema and examples
        run: python scripts/validate_examples.py --schema fhgff3.json --examples examples/fhgff3

      - name: Check LinkML validation equivalence
        run: python scripts/check_linkml.py
      - name: Census schema patterns and gate the released contract inventory
        # FAIR-bioHeaders-Specification#270. ECMA-262 is the floor for `pattern`, so draft
        # lookarounds are reported informationally and never fail this step. Two things are
        # gated against .github/pattern-baseline.json: the registered FILE set (the released
        # surface is discovered by rule, so a new root-level contract fails even with no
        # `pattern` in it) and the `pattern` entry at every pointer inside those files.
        run: python scripts/check_pattern_census.py
      - name: Check the generated JSON-LD context and vocabulary
        run: python scripts/make_jsonld.py --check
      - name: Check the generated CEDAR authoring templates
        run: python scripts/make_cedar.py --check

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # check_conformance.py reads each release tag's manifest so that no
          # published vector id disappears without a retired entry.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check conformance vectors with the standard library only
        run: python scripts/check_conformance.py
      - name: Install the pinned toolkit with the v0.6.0 schemas
        # The version comes from conformance/toolkit-pin.json, which also records the FHT draft digest that release bundles.
        # fair-bioheaders 0.7.0 is the first release that bundles v0.4.0; 0.8.0 adds R11; 0.8.1 adds R4, R5 and R12 (v0.4.1); 0.8.2 enforces the G1 grammar; 0.8.4 adds V6; 0.8.5 adds J3, R14 and J8 (v0.4.2); 0.9.0 bundles v0.5.0 and adds R15, J9 and M5; 0.10.0 keeps the v0.5.0 schemas and adds the V5 near-miss warning; 0.11.0 bundles v0.6.0, whose FHP/FHGFF3 1.2 schemas accept the dotted BUSCO dataset versions cited by the two busco-lineage-dotted vectors; 0.12.0 bundles the FHT draft byte-identical to the CEDAR snapshot (templates/cedar/drafts).
        run: |
          version="$(python -c 'import json; print(json.load(open("conformance/toolkit-pin.json"))["version"])')"
          python -m venv "$RUNNER_TEMP/fhr-converter"
          "$RUNNER_TEMP/fhr-converter/bin/python" -m pip install "fair-bioheaders[jsonld]==$version"
      - name: Read the pinned FHGM model-checker commit
        id: fhgm-checker
        # Recorded once, in templates/cedar/drafts/provenance.json (snapshots.fhgm.ownerChecker).
        run: |
          commit="$(python -c 'import json; print(json.load(open("templates/cedar/drafts/provenance.json"))["snapshots"]["fhgm"]["ownerChecker"]["commit"])')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FHGM-Specification
          ref: ${{ steps.fhgm-checker.outputs.commit }}
          path: _fhgm-owner
          persist-credentials: false
      - name: Check CEDAR exports against the installed released toolkit
        env:
          CEDAR_TOOLKIT: ${{ runner.temp }}/fhr-converter/bin/bioheaders
          # Runs the owning FHGM model check instead of skipping it; that test
          # reads release tags (git show), which this job's first checkout fetches.
          CEDAR_FHGM_ROOT: ${{ github.workspace }}/_fhgm-owner
        run: |
          "$RUNNER_TEMP/fhr-converter/bin/python" -m unittest discover -s tests -p 'test_cedar_toolkit.py' -v
      - name: Run the toolkit on every vector
        run: python scripts/check_conformance.py --skip-regeneration --require-format jsonld --require-format fhp-fasta --require-format fhgff3 --converter "$RUNNER_TEMP/fhr-converter" --known-gaps conformance/toolkit-pin.json
