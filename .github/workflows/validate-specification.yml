name: Validate specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Install JSON-LD test dependencies
        run: python -m pip install -r requirements-jsonld.txt
      - name: Test validation checks
        run: python -m unittest discover -s tests -v
      - name: Validate schema and examples
        run: python scripts/validate_examples.py
      - name: Validate the FHP schema and examples
        run: python scripts/validate_examples.py --schema fhp.json --examples examples/fhp

      - name: Check LinkML validation equivalence
        run: python scripts/check_linkml.py
      - name: Check the generated JSON-LD context and vocabulary
        run: python scripts/make_jsonld.py --check

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check conformance vectors with the standard library only
        run: python scripts/check_conformance.py
      - name: Install the released converter
        run: |
          python -m venv "$RUNNER_TEMP/fhr-converter"
          "$RUNNER_TEMP/fhr-converter/bin/python" -m pip install fhr==0.3.3
      - name: Run the released converter on every vector
        # fhr 0.3.3 predates JSON-LD (feature 011) and FHP (spec 006), so their
        # vectors are skipped.
        run: python scripts/check_conformance.py --skip-regeneration --skip-format jsonld --skip-format fhp-fasta --converter "$RUNNER_TEMP/fhr-converter"
