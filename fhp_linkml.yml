id: https://w3id.org/fhr/fhp
name: FHPLinkML
description: >-
  FHP (FAIR Header Proteome, working name) metadata for protein FASTA files
  (specs/006-protein-header). The FHP class imports the FAIR-bioHeaders shared
  core (schemas/core.yaml) and adds the subject slot proteome and the
  protein-specific slots. Provenance fields are assertions by the producer, not
  checks (FR-013). The id is provisional, like the core's.
prefixes:
  linkml: https://w3id.org/linkml/
  # JSON-LD term IRIs (specs/011-jsonld-mapping research R-05, R-08); slots
  # without a slot_uri get an fhr: term in the family-wide vocabulary.
  sdo: http://schema.org/
  fhr: https://w3id.org/fair-bioheaders/terms#
default_prefix: fhr
default_range: string
imports:
- linkml:types
- schemas/core
- schemas/shared
slots:
  proteome:
    description: Name of the protein set
    slot_uri: sdo:name
    required: true
  sourceType:
    description: >-
      Where the sequences came from: predicted (a gene-prediction or annotation
      run), database (a published database release, set or annotation run) or
      mixed (more than one origin). Not a review status.
    range: SourceType
    required: true
  source:
    description: >-
      Sources of the sequences that are not FAIR-bioHeaders files, as asserted
      by the producer; never verified by checksum
    range: Source
    multivalued: true
    inlined_as_list: true
  geneticCode:
    description: >-
      NCBI translation table ID used to translate the sequences (1-6, 9-16 or
      21-33); omitted when unknown or when the file mixes tables
    range: integer
    any_of:
    - minimum_value: 1
      maximum_value: 6
    - minimum_value: 9
      maximum_value: 16
    - minimum_value: 21
      maximum_value: 33
  isoformPolicy:
    description: Which protein isoforms of each gene the set contains
    range: IsoformPolicy
  predictionSoftware:
    description: Software that produced the gene models or translations
    range: Software
    multivalued: true
    inlined_as_list: true
  predictionProtocol:
    description: Prediction or annotation protocol or workflow reference URI
    range: uri
  sequenceStats:
    description: Counts describing the protein set, as asserted by the producer
    range: SequenceStats
    inlined: true
  completeness:
    description: BUSCO completeness of the protein set, as counts
    range: Completeness
    inlined: true
classes:
  FHP:
    description: Metadata for protein FASTA files (proteomes and protein sets).
    class_uri: sdo:Dataset
    tree_root: true
    slots:
    - schema
    - schemaVersion
    - proteome
    - sourceType
    - taxon
    - version
    - metadataAuthor
    - dateCreated
    - derivedFrom
    - source
    - geneticCode
    - isoformPolicy
    - predictionSoftware
    - predictionProtocol
    - sequenceStats
    - completeness
    - voucherSpecimen
    - accessionID
    - scholarlyArticle
    - documentation
    - identifier
    - relatedLink
    - funding
    - reuseConditions
    - checksum
    slot_usage:
      schema:
        description: >-
          URL of the FHP JSON Schema this record follows; it identifies the
          header type (FR-011)
        pattern: ^https://raw\.githubusercontent\.com/FAIR-bioHeaders/(FHR|FAIR-bioHeaders)-Specification/[A-Za-z0-9._/-]+/fhp\.json$
      schemaVersion:
        description: Version of the FHP schema
        equals_number: 1
      version:
        description: Version of the protein set
      metadataAuthor:
        description: Authors of the FHP instance
      dateCreated:
        description: Date the protein set was created
      accessionID:
        description: Accession of the protein set
      scholarlyArticle:
        description: Scholarly article where the protein set was published
      documentation:
        description: Documentation about the protein set
      identifier:
        description: Identifiers of the protein set
      relatedLink:
        description: Related URLs to the protein set
      reuseConditions:
        description: Reuse conditions or license for the protein set
  SequenceStats:
    description: Counts describing a protein set
    class_uri: fhr:SequenceStats
    attributes:
      sequenceCount:
        description: Number of protein sequences in the file
        range: integer
        minimum_value: 0
      geneCount:
        description: Number of genes the sequences represent
        range: integer
        minimum_value: 0
      totalResidues:
        description: Total number of residues in the file
        range: integer
        minimum_value: 0
enums:
  SourceType:
    description: Where the sequences of a protein set came from (FR-005)
    permissible_values:
      predicted:
        description: >-
          Every sequence was produced by a gene-prediction or annotation run
          (translated gene models or ORFs)
      database:
        description: >-
          Every sequence was taken from a published database release, set or
          annotation run
      mixed:
        description: The set combines more than one origin, or adds contributed sequences
  IsoformPolicy:
    description: Which protein isoforms of each gene a set contains
    permissible_values:
      all:
        description: All isoforms
      longestPerGene:
        description: One isoform per gene, the longest
      canonicalPerGene:
        description: One isoform per gene, the source's canonical choice (not necessarily the longest)
