# Draft registry of community profiles (FAIR-bioHeaders-Specification#51).
#
# A profile is a *proposal* until the named community and the maintainers review
# it. Nothing in this file is adopted, endorsed or published, and listing a
# profile here does not change any published schema. The registry lets a
# validator report an unsupported profile by name instead of silently passing.
#
# Fields:
#   header_type  the base type the profile layers on
#   model        the LinkML profile model, relative to this file
#   base_model   the published type model the profile imports
#   status       draft (proposed, unreviewed) | reviewed | adopted
#   community    who the requirements are attributed to (and whether they have
#                been consulted; no entry here claims endorsement)
#   owner        a maintainer or community contact, unassigned until review
#   issue        where the proposal is tracked
profiles:
  agbiodata-fhr:
    header_type: FHR
    model: agbiodata-fhr.yaml
    base_model: fhr_linkml.yml
    status: draft
    community: AgBioData (illustrative; not consulted, no endorsement claimed)
    owner: unassigned
    issue: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification/issues/51
