documentation: >-
  Subset reference file, not a published assembly delivery. It holds exactly one
  sequence record: chromosome 4 of Drosophila melanogaster Release 6 plus ISO1
  MT, RefSeq NC_004353.4 (GenBank AE014135.4, assembled molecule, chromosome,
  1348131 bp, UCSC name chr4), copied verbatim as one FASTA record from the
  delivery's GCF_000001215.4_Release_6_plus_ISO1_MT_genomic.fna. The remaining
  1869 sequence records of that assembly, including the other six chromosomes and
  the mitochondrion, are NOT present: the whole-assembly checksum is therefore
  not the checksum of this file, and any parent link to this file means this
  subset. Masking was measured on the shipped bytes, not assumed: 374633 of the
  1331131 ACGT characters (28.14% of letters, 27.79% of all symbols) are
  lowercase, so the file is soft-masked; the uppercase NCBI component file
  assembly_structure/Primary_Assembly/assembled_chromosomes/FASTA/chr4.fna
  (md5 edd1c69d6360fe22ee850c3bca51894b) is identical to this record except for
  letter case. The 17000 N characters are one NCBI-reported within-scaffold gap
  at 1200663-1217662 with map linkage evidence, from the delivery's
  _genomic_gaps.txt. totalBasePairs and gcContent (35.25% of ACGT characters,
  case-insensitive) are recomputed from these bytes; scaffold and contig counts
  are omitted because a one-record slice does not describe an assembly's
  contig/scaffold structure. Sequence bytes are reproduced unmodified from the
  NCBI RefSeq delivery and are not relicensed by this header; the delivery itself
  supplies no license statement, so no reuseConditions value is asserted here.
  This file exists to exercise a real FHR-to-FHT parent link for a chr4-only
  transcript subset (a teaching and pilot artifact): a real deployment would point
  at the full GCF_000001215.4 assembly file instead.
