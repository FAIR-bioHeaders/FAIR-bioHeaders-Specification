documentation: >-
  FAIR-bioHeaders FHR pilot for the two-lined spittlebug reference genome
  (Prosapia bicincta, isolate DM-2020), assembled with HiFiASM v. 0.16.0-r369
  from PacBio Sequel HiFi data as described in the GenBank assembly record.
  The published _genomic.fna bytes are soft-masked: 1,129,108,786 of
  2,219,553,221 ACGT characters are lowercase (measured 2026-11-14); the
  only N bases are the 41,900 scaffold-gap characters reported by NCBI. The masking
  agent is not documented in the GenBank structured comment, so soft-masked
  (the observable lowercase encoding) is asserted rather than repeat-masked.
  This assembly is genome-only: its FTP delivery offers no _protein.faa.gz,
  _genomic.gff.gz or _cds_from_genomic.fna.gz, and _feature_count.txt reports
  gene protein_coding with Unique Ids 0 and Placements 0 (re-probed
  2026-11-14), so it supports no FHP, FHGFF3 or FHT header.
