name: Validate FHT specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the HTML binding test resolves the commit that last
          # changed fht.json and verifies its stored bytes (tests/fht_microdata.py).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Test the generated contract
        run: python -m unittest discover -s tests -v
      - name: Regenerate and reject uncommitted drift
        run: |
          python json-schema-generator.py
          git diff --exit-code fht.json
      - name: Check pinned shared imports
        run: python scripts/check_provenance.py

  browser:
    # Optional-dependency lane (docs/FHT-MICRODATA.md, "Optional browser-DOM
    # verification"): extract the seven typed-HTML examples with a real
    # Chromium DOM and compare them with the canonical JSON. Pinned Playwright.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install Playwright 1.65.0 and Chromium outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/fht-browser" --ignore-scripts playwright@1.65.0
          "$RUNNER_TEMP/fht-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Lossless integer comparison controls
        run: node --test tests/test_browser_integers.mjs
      - name: Browser-DOM extraction of the HTML examples
        env:
          FHT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/fht-browser/node_modules/playwright
        run: node scripts/check_fht_html_browser.mjs
